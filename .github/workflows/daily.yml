name: 考公每日加油站

on:
  # ·GitHub
  #  07:00 / 22:00GitHub  UTC 8  7:00~7:30
  schedule:
    - cron: '0 23 * * *'    # 北京时间约 07:00 → 早间版(morning)
    - cron: '0 14 * * *'    # 北京时间约 22:00 → 晚间版(evening)
  # · SCF  mode 3.5
  workflow_dispatch:
    inputs:
      mode:
        description: '推送模式：morning=早上备考知识点版(今日) / evening=晚上预告版(明日)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run and send
        env:
          PUSH_MODE: ${{ github.event.inputs.mode }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
