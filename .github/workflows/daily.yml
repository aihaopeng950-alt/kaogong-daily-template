name: 考公每日加油站

on:
  # 触发方式一（默认·推荐，无需任何云账号）：GitHub 自带定时
  # 北京时间约 07:00 / 22:00（GitHub 使用 UTC，比北京早 8 小时；免费仓库可能延迟几分钟，通常在 7:00~7:30 之间）
  schedule:
    - cron: '0 23 * * *'    # 北京时间约 07:00 → 早间版(morning)
    - cron: '0 14 * * *'    # 北京时间约 22:00 → 晚间版(evening)
  # 触发方式二（备选·精准）：腾讯云 SCF 定时精准调用并传入 mode（见《部署使用说明书》第 3.5 节）
  workflow_dispatch:
    inputs:
      mode:
        description: '推送模式：morning=早上备考知识点版(今日) / evening=晚上预告版(明日)'
        required: false
        default: ''

# 允许脚本把「已发送历史」写回仓库，用于跨天去重（避免内容重复推送）
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run and send
        env:
          PUSH_MODE: ${{ github.event.inputs.mode }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
